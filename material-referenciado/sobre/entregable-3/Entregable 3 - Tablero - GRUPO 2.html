:`con condiciones`,texto:`Seis acciones, cinco antes de la primera lista.`},{area:`Económica`,valor:`No viable`,escala:`ROI −99,95 % a un año`,texto:`Ni la regla sola recupera su costo.`},{area:`Tasa de éxito`,valor:`1,02 %`,escala:`sin grupo de control`,texto:`Un techo: el efecto no está medido.`}],decision:`**Viable con condiciones, solo como piloto.** La lista de 500 por mes sale con la regla del umbral, sin modelo; tres meses con grupo de control deciden si se invierte más.`,fuente:`Parte D 11.1`,ids:[`F16`,`G40`,`G38`,`H40`,`G31`,`J09`],guion:`Somos el grupo 2. Casa Óga quiere saber a tiempo qué clientes van a dejar de comprar, para que Marketing los contacte. ¿Conviene anticiparlos? Con un modelo, no. Con la regla, depende de cuántos vuelvan: lo mide un piloto. El veredicto es viable con condiciones, solo como piloto. Lo técnico y lo legal son viables con condiciones. Lo económico no cierra: el modelo sobre la regla da un ROI de −99,95 % a un año. Y para que la regla sola se pague, tendría que volver casi la mitad de los que se iban: 48,6 veces este 1,02 %.`,segundos:50},{n:3,quien:`Sebastian C.`,tipo:`problema`,kicker:`El problema`,pregunta:`¿Quién se va?`,titulo:`Un cliente se va cuando pasa más días sin comprar que su propio umbral`,definicion:[`**Umbral** = 1,5 × su ritmo de compra, con un piso de 90 días.`,`**Se va** si pasa su umbral en los 90 días siguientes al corte (25,35 % en los cortes de enero a mayo de 2025). **La regla** toma a los 500 contactables más cerca de su umbral: el piso de lo que Marketing puede contactar por mes.`,`**El modelo** busca a los que lo van a pasar.`,`«Envío N»: pregunta N del relevamiento a Casa Óga.`],figura:`cliente.png`,pie_figura:`Un cliente real de validación (Parte C 7.3).`,cifras:[{valor:`−35,6 %`,texto:`ventas de 2025, con meses incompletos. Contra 2024; el rubro, +0,3 % en el año (CAME)`},{valor:`500[[/mes]]`,texto:`clientes que Marketing puede contactar: de 500 a 800 (envío 29)`}],fuente:`Parte A 2.1 · Parte C 6.5 y 7.3`,ids:[`F02`,`C14`,`C08`,`H23`],guion:`De los clientes que siguen comprando al corte, el 25,35 % se va en los 90 días siguientes. Cada cliente tiene su umbral: 1,5 veces su intervalo habitual entre compras, con un piso de 90 días. Se va si lo pasa sin comprar. Este cliente compra cada 162 días, su umbral es 243 y al corte llevaba 181. Le faltaban 62 días y en los 90 siguientes lo cruzó. La regla, sin modelo, ordena a todos por estos días que faltan y toma los 500 más cerca: los que Marketing puede contactar por mes.`,segundos:55},{n:4,quien:`Tomas F.`,tipo:`figura_filas`,kicker:`Parte A · Factibilidad técnica`,pregunta:`¿Se puede construir?`,titulo:`Sí, con condiciones: los datos alcanzan y el límite es quién opera la lista`,figura:`tecnica.png`,pie_figura:`Escala de la cátedra: 2,1 a 2,5 es factibilidad media.`,escala:`Escala de la cátedra: ●●● satisfecha · ●●○ débil pero superable · ●○○ bloquea · promedio de 2,1 a 2,5: factibilidad media`,filas:[{rotulo:`Datos`,texto:`4.636 casos para entrenar; la alerta es 50 a 100. Críticas: transacciones e identidad.`,detalle:`datos al 31/12/2025`},{rotulo:`Calidad`,texto:`44,8 % de las ventas no tiene cliente identificado.`},{rotulo:`Infraestructura`,texto:`Sin servidor ni BI: exportación manual cada mes.`},{rotulo:`Capacidad humana`,texto:`Casa Óga no definió quién opera la lista: en el piloto, el equipo consultor (envío 71).`,detalle:`en el piloto, el equipo consultor`}],nota:`El proyecto anterior se cortó porque «no quedó un responsable claro de mantenerlos» (envío 15).`,fuente:`Parte A 1.1 a 1.4`,ids:[`F16`,`G10`,`F11`,`C19`],guion:`Puntuamos cuatro condiciones de 1 a 3. Los datos alcanzan con margen: hay 4.636 casos positivos para entrenar. Las otras tres quedan en 2: el 44,8 % de las ventas no tiene cliente, todo se exporta a mano y Casa Óga todavía no definió quién opera la lista. El promedio, 2,25, es factibilidad media. Lo que más pesa es quién opera: el proyecto anterior se cortó porque nadie lo mantuvo. En el a; la práctica actual, 37,6 %.`,pie_800:`Lista de 800 por mes, no decide: regla 63,0 %, logística 62,6 %.`,fuente:`Parte A 2.2 y 2.5 · Parte B 4.1 a 4.5 · Parte D 11.2`,ids:[`F07`,`F08`,`G11`,`G13`,`G14`,`G15`,`G17`,`G24`,`G12`,`H06`,`J11`],guion:`Comparamos la regla con un modelo por la precisión de la lista de 500. Cada fila es la logística menos la regla, con su intervalo: las finas son validación y las gruesas, el test, que abrimos una sola vez. Sin filtrar, en el test la logística gana por 1,06 puntos.`,segundos:30},{n:7,quien:`Juan Manuel R.`,tipo:`figura_callouts`,kicker:`Modelado · Etapa 3`,pregunta:`¿Y con la lista que se puede mandar?`,titulo:`En validación el modelo queda debajo de la regla; en test empatan`,figura:`lista.png`,pie_figura:`Arriba, la lista de 500 contactables en validación. Abajo, la importancia por permutación de la logística ajustada.`,callouts:[{titulo:`Ajuste`,texto:`4 pliegues temporales con embargo. Sobreajuste del boosting: de 18,1 a 6,4 puntos. Logística: 82,6 % sin filtro.`},{titulo:`Lista contactable`,texto:`483 de 1.500 lugares no se pueden contactar. Con 500 contactables: regla 75,8 %, logística 73,9 %.`},{titulo:`Control de fuga`,texto:`De 43 variables, 3 salen y 3 se recalculan: las 40 que quedan no miran después del corte.`}],fuente:`Parte A 2.3 · Parte C 7.1 a 7.3 · Parte D 8.1 y 11.2`,ids:[`H01`,`H08`,`H05`,`H17`,`H16`,`H21`,`H45`,`J03`,`J09`,`J10`],guion:`Pero esa lista no se puede mandar: un tercio no aceptó marketing o pidió la baja. Con la lista que sale, en validación ganaba la regla y en el test empatan: −0,25 puntos, con un intervalo que cruza el cero. Para pagar los USD 10.400 que agrega, el modelo necesitaría más aciertos de los que caben en la lista de 500. Por eso la lista sale con la regla.`,segundos:40},{n:8,quien:`Francisco C.`,tipo:`economia`,kicker:`Parte B · Factibilidad económica`,pregunta:`¿Cuánto vale acertar?`,titulo:`En el escenario esperado, el modelo suma USD 5,38 al año y cuesta USD 10.400 más`,cel ame (Ley 26.951) · **Escala de la cátedra:** 1,6 a 2,5, viable con condiciones`,fuente:`Parte C 5.1 a 5.4`,ids:[`H40`,`C18`,`H09`,`G48`,`H41`,`H47`],guion:`Las cinco dimensiones legales quedan en 2: viable con condiciones. El riesgo más grande ya ocurre: el 30,1 % de los envíos fue a quien no aceptó marketing. Nuestra planilla sale sin ellos. Son seis acciones; la primera, en la semana 1, es el acuerdo de confidencialidad: sin él no recibimos ningún dato más.`,segundos:30},{n:11,quien:`Matías S.`,tipo:`riesgos`,kicker:`Parte C · Riesgos`,pregunta:`¿Qué puede salir mal?`,titulo:`Tres riesgos críticos, cada uno con su señal y su umbral`,columnas:[{n:`1`,riesgo:`La tasa de éxito no paga la lista`,filas:[{rotulo:`Señal`,texto:`cruce a 90 días, control menos cada rama`},{rotulo:`Umbral`,texto:`menos de **12,41 puntos** en la semana 28 (9,92 sin descuento)`},{rotulo:`Dueño`,texto:`Juan Manuel R., cada mes`}]},{n:`2`,riesgo:`Después del piloto nadie opera la lista`,filas:[{rotulo:`Señal`,texto:`si María G. eligió quién opera`},{rotulo:`Umbral`,texto:`sin elegir en la **semana 13**`},{rotulo:`Dueño`,texto:`Sebastian C., cada mes`}]},{n:`3`,riesgo:`La lista llega a quien no aceptó marketing`,filas:[{rotulo:`Señal`,texto:`clientes sin consentimiento o con baja`},{rotulo:`Umbral`,texto:`**1 cliente**: la planilla no sale`},{rotulo:`Dueño`,texto:`Sebastian C., antes de cada envío`}]}],nota:`**Límites:** solo clientes identificados · no distingue compradores profesionales · datos al 31/12/2025 · el piloto no mide al 20 % de mayor facturación.`,fuente:`Parte C 6.2 a 6.5`,ids:[`G62`,`G61`,`H46`,`C18`,`H45`],guion:`De los 13 riesgos, tres son críticos, cada uno con su umbral: que la tasa de éxito no pague la lista, que después del piloto nadie la opere y que llegue a alguien sin consentimiento. Con un solo cliente así, la planilla no sale.`,segundos:25},{n:12,quien:`Sebastian C.`,tipo:`piloto`,kicker:`La propuesta`,pregunta:`¿Qué decide María G. con el piloto?`,titulo:`Un piloto de tres meses con grupo de control decide si se invierte más`,figura:`piloto.png`,hechos:[`**1.200** contactados en dos ramas · **300** de control: 100 por mes, sorteados entre los de la lista fuera del 20 % de mayor facturación (envío 45)`,`**USD 1.350** de horas + **ARS 53.538** de acciones, que paga Marketing`],pedidos_titulo:`Para que decida María G.`,pedidos:[`El alcance: regla sin modelo y piloto con control (semana 1).`,`La regla del target, con revisión de Sofía R. (semana 2).`,`Quién inscribe las bases en la AAIP (semana 2).`,`Quién opera la lista después del piloto (semana 13).`,`Si pasa a producción, con 12,41 puntos o más (semana 28).`],nota:`Plan de 28 semanas desde la entrega; la primera lista sale en la semana 6, la decisión preliminar es en la 20 y la final en la 28 (10/05/2027). El grupo de control lo aprueba Sofía R. (semana 2).`,puente:`lo que paga seguir un año`,control:`control sorteado cada mes en la lista, fuera del 20 % de mayor facturación`,fuente:`Parte B 3.6 · Parte C 6.3 · Parte D 12.1 a 12.4`,ids:[`G49`,`G61`,`G62`,`G50`,`J50`],guion:`Falta medir la tasa de éxito. Tres meses la lista sale con la regla, en dos ramas, con y sin descuento, y cada mes 100 clientes quedan sin contactar: el grupo de control. Decide el cruce del umbral a 90 días. Si los contactados cruzan 12,41 puntos menos que el control, 9,92 sin descuento, lo que paga seguir un año, María G. pasa a producción; si no, el proyecto cierra. Con la tasa de hoy, lo esperable es 0,79 puntos: el piloto mide si la tasa real es otra.`,segundos:50},{n:13,quien:`Sebastian C.`,tipo:`plan`,kicker:`La propuesta`,pregunta:`¿Cómo funciona cada mes y en qué semana?`,titulo:`La primera lista sale en la semana 6 y María G. decide en la 28`,flujo:[{titulo:`Exportar`,texto:`Archivos del mes, con un mismo corte`,quien:`Lucía O., Operaciones`},{titulo:`Preparar`,texto:`Umbral por cliente; frena un mes incompleto`,quien:`Matías S.`},{titulo:`Ordenar`,texto:`Los 500 contactables más cerca del umbral`,quien:`Sebastian C.`,enfasis:!0},{titulo:`Entregar`,texto:`Planilla con 100 de control`,quien:`Sebastian C.; el sorteo, Francisco C.`},{titulo:`Contactar`,texto:`WhatsApp con y sin 15 % de descuento`,quien:`Sofía R.`},{titulo:`Medir`,texto:`Cruce a 90 días contra el control; alerta si la precisión baja de 72,0 % dos meses seguidos`,quien:`Juan Manuel R.`}],hitos:[{n:2,clave:`alcance`,hito:`Alcance aprobado`,quien:`María G.`,criterio:!1},{n:3,clave:`regla_y_operador_del_piloto`,hito:`Regla del target y operador del piloto`,quien:`María G.`,criterio:!0},{n:4,clave:`acciones_legales_y_control`,hito:`Acciones legales hechas`,quien:`María G.`,criterio:!0},{n:5,clave:`acciones_legales_y_control`,hito:`Control y planilla de prueba`,quien:`Sofía R.`,criterio:!0},{n:6,clave:`extracto_regenerado`,hito:`Extracto completo, mismo corte`,quien:`Matías S.`,criterio:!0},{n:7,clave:`go_live`,hito:`Sale la primera lista`,quien:`María G.`,criterio:!0},{n:8,clave:`operador_despues_del_piloto`,hito:`Operador de después del piloto`,quien:`María G.`,criterio:!1},{n:9,clave:`preliminar`,hito:`Decisión preliminar`,quien:`María G.`,criterio:!1},{n:10,clave:`decision`,hito:`Decisión de producción`,quien:`María G.`,criterio:!1}],rotulo_hitos:`Hitos del plan, con su dueño · go-live = primera lista`,llave_go_live:`criterios de go-live`,fuente:`Parte D 9.2 y 12.1 a 12.4`,ids:[`J50`,`J13`,`G49`,`G63`],guion:`Cada mes, la regla arma la lista, Sofía R., de Marketing, decide a quién escribir y medimos contra el control. La primera lista sale en la semana 6, con los cinco criterios de go-live cumplidos. María G. decide en la semana 20, de forma preliminar, y en la 28. Entonces, ¿conviene anticipar? Con la regla, sin modelo, y solo si el piloto muestra que el contacto paga.`,segundos:40},{n:14,quien:`Tomas F.`,tipo:`correccion`,kicker:`Corrección al Grupo 5`,pregunta:`¿Qué le corregimos al Grupo 5?`,titulo:`5 de 13 bloques a revisar: seis observaciones, cinco de cifras o de método`,contexto:`Consolidado E3 del Grupo 5 (v2.0, 76 págs.) · 13 bloques · formato de la devolución de la cátedra`,fuente:`Planilla de correcciones al Grupo 5 (v2.2)`,ids:[],guion:`Corregimos como consultores externos el consolidado del Grupo 5, una fila por bloque de secciones. De 13 bloques, 5 quedan para revisar, ninguno en la Parte C, con seis observaciones. Uno: las etiquetas de entrenamiento miran los meses de validación. La cátedra nos marcó lo mismo en el E2 y lo corregimos con dos meses de embargo. Dos: el 73 % del beneficio no se puede rehacer. Tres: el go-live baja el recall mínimo de 70 % a 65 % sin decirlo. Cuatro: el piloto mide la recuperación en otra escala que el 15 % de su Parte B, y no lo alcanza ni el escenario optimista. Cinco: el cambio de la 7.5 no llega a la 11.2 ni a la 3.4. Seis: lo que cambió de la v1 está en la página 74.`,segundos:75},{n:15,quien:`Juan Manuel R.`,tipo:`correccion`,kicker:`Corrección al Grupo 5`,pregunta:`¿Qué está bien y qué nos deja?`,titulo:`Concluimos distinto sobre todo por el target: el nuestro casi coincide con lo que ordena la regla`,bien_corto:[{seccion:`1.4 Inventario de fuentes de datos`,texto:`44,8 % de transacciones sin cliente: igual con los CSV del caso.`},{seccion:`3.2 y 4.4 Costos y dinero del modelo`,texto:`La tabla de costos cierra al dólar y la cuenta de la 4.4 se rehace con sus supuestos.`},{seccion:`5.1 y 5.2 Consentimiento y bajas`,texto:`1.211 bajas: igual con los CSV del caso.`}],fuente:`Planilla de correcciones al Grupo 5 (v2.2)`,ids:[],guion:`Ocho de los 13 bloques están completos. Rehicimos las cifras de cinco secciones y cierran: el 44,8 % de transacciones sin cliente y las 1.211 bajas salen igual de los CSV del caso, y sus costos cierran al dólar. El cruce explica por qué concluimos distinto. Las dos reglas ordenan por atraso; lo que cambia, sobre todo, es el target. El nuestro es cruzar su umbral en 90 días, casi lo mismo que ordena la regla: su AUC es 0,968 y la logística, 0,966. Al modelo no le queda dónde ganar. El suyo es no comprar en el doble de su intervalo: su regla da 0,589 y su modelo, 0,783. Con su target gana el modelo; con el nuestro alcanza la regla, y ninguna cifra nuestra cambia. Gracias.`,segundos:70}],RIESGOS:{n:`A4`,titulo:`Matriz de riesgos: 13 riesgos, cada uno con su acción`,fuente:`Parte C 6.2`,ids:[`H44`,`H46`],columnas:[`#`,`Tipo`,`Riesgo`,`Prob.`,`Impacto`,`Estrategia`],anchos:[.5,1.8,7,1,1.1,1.4],filas:[[`1`,`Técnico`,`Los extractos no se regeneran a tiempo o llegan con un mes incompleto`,`M`,`A`,`Mitigar`],[`2`,`Técnico`,`Al cerrar el piloto, Casa Óga no contrata analista ni soporte y nadie opera la lista`,`M`,`A`,`Mitigar`],[`3`,`Técnico`,`El CRM no acepta importar la lista`,`M`,`B`,`Aceptar`],[`4`,`Económico`,`La tasa de éxito no paga la lista`,`A`,`A`,`Mitigar`],[`5`,`Económico`,`La oferta vale hasta la próxima compra y la lista pierde dinero`,`M`,`A`,`Evitar`],[`6`,`Legal`,`La lista llega a un cliente sin consentimiento o que pidió la baja`,`M`,`A`,`Mitigar`],[`7`,`Legal`,`El proveedor del CRM usa, cede o transfiere los datos sin cláusulas`,`B`,`A`,`Transferir`],[`8`,`Organizacional`,`Marketing no usa la lista o la usa en parte`,`M`,`A`,`Mitigar`],[`9`,`Organizacional`,`María G. no acepta el cambio de alcance o cambia prioridades`,`M`,`A`,`Mitigar`],[`10`,`Entorno`,`Cambia el consumo del rubro y el ritmo de compra de 2023 y 2024 deja de valer`,`M`,`A`,`Mitigar`],[`11`,`Entorno`,`La integración de fidelización con la tienda online cambia el registro de clientes`,`B`,`M`,`Aceptar`],[`12`,`Modelo`,`La lista acierta menos en mujeres, en género X, en alto valor y con menos de 12 meses`,`A`,`M`,`Mitigar`],[`13`,`Modelo`,`Se reemplaza la regla por la logística sin que le gane`,`B`,`A`,`Evitar`]],destacar:[3,1,5],pie:`En azul, el top 3 de la 6.3. Prob. e impacto: alta (A), media (M), baja (B).`},TIEMPOS:{palabras_por_minuto:130,cambio_s:3,total_s:445,turnos:[{quien:`Sebastian C.`,diapositivas:[2,3],segundos:105},{quien:`Tomas F.`,diapositivas:[4,5],segund
